name: Build Trakt Feed

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: trakt-feed-pages
  cancel-in-progress: false

jobs:
  export-and-generate-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Perl dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cpanminus
          sudo cpanm --installdeps --notest .

      - name: Fetch Trakt episode history
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: perl bin/get-history > history.json

      - name: Generate Atom feed
        run: |
          mkdir -p docs
          perl bin/mkfeed history.json > docs/feed.xml
          test -s docs/feed.xml

      - name: README to index
        uses: davorg/readme-to-index@v1
        with:
          output: docs/index.html
          google_analytics: G-YJCYWQFHGB

      - name: Upload feed to Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

  deploy:
    needs: export-and-generate-feed
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
